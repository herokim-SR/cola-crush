<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>콜라 박살내기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg">
<meta name="theme-color" content="#bfe9ff">
<style>
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:#bfe9ff;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#222}
  canvas{display:block;touch-action:none}
  #game{position:fixed;left:0;top:0;width:100vw;height:100vh}
  #fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:20}
  .btn{min-width:96px;padding:0 16px;min-height:72px;font-size:30px;font-weight:700;border:none;border-radius:20px;background:#fff;color:#222;box-shadow:0 4px 0 #0003;cursor:pointer;font-family:inherit}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0003}
  .btn:focus-visible{outline:4px solid #1e6fff;outline-offset:2px}
  .big{min-height:88px;font-size:40px;padding:0 36px}
  #topRight{position:fixed;top:12px;right:12px;display:flex;gap:12px;z-index:30}
  #hudLeft{position:fixed;top:8px;left:14px;z-index:5;pointer-events:none;font-size:30px;font-weight:800;line-height:40px;text-shadow:0 2px 0 #fff,0 0 6px #fff}
  #coinLine{display:flex;align-items:center;gap:6px}
  #coinIcon{width:36px;height:36px}
  .overlay{position:fixed;inset:0;z-index:10}
  #start{background:rgba(191,233,255,.55)}
  /* 시작 화면 묶음: 위치는 main.js layoutStart()가 캔·소리 버튼과 겹치지 않게 계산해서 정함 */
  #startBox{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;word-break:keep-all}
  #startBox.stack h1,#startBox.stack #startHint{white-space:nowrap}
  #start h1{margin:0;font-size:64px;line-height:1.15;text-align:center;color:#E63946;text-shadow:0 4px 0 #fff,0 0 3px #222}
  #startHint{margin:0;font-size:30px;line-height:1.3;font-weight:800;color:#222;text-shadow:0 2px 0 #fff,0 0 6px #fff}
  #startRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 20px;margin-top:4px}
  #bestStart{font-size:30px;font-weight:700;line-height:1.3}
  #bestStart:empty{display:none}
  #pause{position:relative}
  #pauseBadge{position:absolute;top:-14px;right:-14px;text-shadow:none;width:40px;height:40px;line-height:34px;font-size:22px;text-align:center;background:#FFD23F;border:3px solid #222;border-radius:50%;pointer-events:none}
  #toast{position:fixed;left:50%;top:128px;z-index:25;max-width:calc(100vw - 24px);padding:12px 22px;background:#fff;border:4px solid #222;border-radius:24px;font-size:28px;font-weight:800;line-height:1.3;text-align:center;pointer-events:none;box-shadow:0 4px 0 #0003;opacity:0;transform:translate(-50%,-16px);transition:opacity .3s ease,transform .3s ease}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  /* 첫 판 안내 말풍선이 보이는 동안에는 알림을 화면 아래(식탁)로 — 서로 겹치지 않게 */
  #toast.low{top:auto;bottom:16px;transform:translate(-50%,16px)}
  #toast.low.show{transform:translate(-50%,0)}
  #panel{overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:rgba(191,233,255,.6);padding:128px 12px 24px}
  #panel *{touch-action:pan-y}
  .sheet{max-width:760px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:0 6px 0 #0002;padding:20px 18px 28px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  #hurrayTitle{margin:0;font-size:64px;color:#FF8C1A;text-shadow:0 3px 0 #222}
  #panelInfo{font-size:28px;font-weight:700;margin:0}
  .shop{width:100%;border-top:4px dashed #ddd;padding-top:12px}
  .shop h2{margin:4px 0 8px;font-size:36px}
  .shop h3{margin:16px 0 8px;font-size:28px}
  #shopCoins{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px;font-weight:800}
  #shopCoinIcon{width:40px;height:40px}
  .cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
  .card{width:160px;background:#fff7e8;border:3px solid #f0d9b0;border-radius:20px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .card.on{border-color:#2fb344;background:#eaffea}
  .card canvas{width:80px;height:80px}
  .card .name{font-size:22px;font-weight:800}
  .card .info{font-size:18px;color:#555;min-height:22px}
  .card .price{font-size:22px;font-weight:800;color:#b25b00;min-height:26px}
  .card .btn{width:100%;min-width:0;min-height:64px;font-size:22px;padding:0 6px}
  .card .btn:disabled{background:#eee;color:#666;box-shadow:none;cursor:default}
  /* HUD 버튼: 콜라캔 색 타일 + 코드로 그린 큰 그림 + 아래 짧은 글자. 검정 외곽선 4px(게임 그림과 같은 선), 아래 그림자 = 식탁 위 캔 느낌 */
  .hud{min-width:96px;min-height:96px;padding:6px 10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:4px solid #1E1E1E;border-radius:22px;color:#fff;font-size:24px;font-weight:900;line-height:1;box-shadow:0 6px 0 #1E1E1E;text-shadow:0 2px 0 #0006;position:relative}
  .hud:active{transform:translateY(4px);box-shadow:0 2px 0 #1E1E1E}
  .hud .ico{width:60px;height:54px;display:block;filter:drop-shadow(0 2px 0 #0006)}
  .hud .ico rect,.hud .ico .spk{fill:#fff;stroke:#1E1E1E;stroke-width:2.5;stroke-linejoin:round}
  .hud .ico .wave{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round}
  .hud .ico .cross{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
  .hud::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:6px;border-radius:3px;background:#ffffff55}
  #pause.hud{background:#E63946}
  #sound.hud{background:#FF8C1A}
  #sound.hud.off{background:#1E1E1E;border-color:#1E1E1E;box-shadow:0 6px 0 #555}
  #sound.hud.off .ico .spk{fill:#fff}#sound.hud.off .ico .cross{stroke:#FF5A5F}
  #sound .off-ico{display:none}
  #sound.off .on-ico{display:none}
  #sound.off .off-ico{display:block}
  @media (max-width:560px){.hud{min-width:84px;min-height:84px;font-size:20px}.hud .ico{width:50px;height:44px}}
  @media (max-width:560px){.btn{font-size:24px;min-width:80px;padding:0 12px}.big{font-size:32px}#start h1{font-size:48px}#startHint{font-size:24px}#hudLeft{font-size:26px}.card{width:140px}#toast{font-size:22px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudLeft" hidden>
  <div id="score">⭐ 0점</div>
  <div id="coinLine"><canvas id="coinIcon"></canvas><span id="coinText">코인 0</span></div>
</div>

<div id="topRight">
  <button id="pause" class="btn hud" hidden aria-label="쉬기"><svg class="ico" viewBox="6 5 36 38" aria-hidden="true"><rect x="10" y="8" width="10" height="32" rx="3"/><rect x="28" y="8" width="10" height="32" rx="3"/></svg><span class="lbl">쉬기</span><span id="pauseBadge" hidden>🎁</span></button>
  <button id="sound" class="btn hud" aria-label="소리 켜기 끄기" aria-pressed="true"><svg class="ico on-ico" viewBox="3 6 42 36" aria-hidden="true"><path class="spk" d="M6 18h8l11-9v30l-11-9H6z"/><path class="wave" d="M31 18q4 6 0 12"/><path class="wave" d="M36 13q8 11 0 22"/></svg><svg class="ico off-ico" viewBox="3 6 42 36" aria-hidden="true"><path class="spk" d="M6 18h8l11-9v30l-11-9H6z"/><path class="cross" d="M31 17l12 14M43 17L31 31"/></svg><span class="lbl" id="soundLbl">소리 켬</span></button>
</div>

<div id="start" class="overlay">
  <div id="startBox" class="stack">
    <h1 id="startTitle">콜라 박살내기</h1>
    <p id="startHint">윗부분을 톡! 꾹 누르면 더 세게!</p>
    <div id="startRow">
      <button id="startBtn" class="btn big">▶ 시작</button>
      <div id="bestStart"></div>
    </div>
  </div>
</div>

<div id="toast" aria-live="polite"></div>

<div id="panel" class="overlay" hidden>
  <div class="sheet">
    <h1 id="hurrayTitle">🎉 오예! 🎉</h1>
    <p id="panelInfo"></p>
    <button id="continueBtn" class="btn big">▶ 계속하기</button>
    <section class="shop">
      <h2>🎁 상점</h2>
      <div id="shopCoins"><canvas id="shopCoinIcon"></canvas><span id="shopCoinText">코인 0</span></div>
      <h3>망치</h3>
      <div id="hammerCards" class="cards"></div>
      <h3>망치 무늬</h3>
      <div id="skinCards" class="cards"></div>
    </section>
    <button id="restartBtn" class="btn big">🔄 다시 하기</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script src="src/art.js"></script>
<script src="src/sfx.js"></script>
<script src="src/main.js"></script>
<script>
  // file:// 에서는 서비스워커가 동작하지 않는다(플레이는 가능). http(s)/LAN 서버에서 열어야 오프라인 설치된다.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
